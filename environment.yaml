name: 'kcds-ml'
channels:
    - conda-forge
    - defaults
dependencies:
    - python>=3.11,<3.13
    - altair-all=5.5.*    # charts; slide decks call chart.save() to PNG, which needs vl-convert
    - pandas=2.2.*
    - scikit-learn
    - scipy               # imported by Module 5, 7 and 8 slides
    - matplotlib          # decision boundaries (src/model_plotting_mg.py) and confusion matrices
    - graphviz            # Graphviz binaries for src/display_tree.py
    - python-graphviz     # Python bindings for Graphviz
    - xgboost             # Module 1 opening slides
    - jupyter             # Quarto executes the slide decks through a Jupyter kernel
    - quarto
